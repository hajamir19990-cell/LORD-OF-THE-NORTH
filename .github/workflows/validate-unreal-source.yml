name: Validate Unreal source structure

on:
  push:
    branches:
      - rebuild/unreal-5-mobile
    paths:
      - "LORD_OF_THE_NORTH.uproject"
      - "Config/**"
      - "Source/**"
      - "Content/SourceMeshes/**"
      - "Content/MAPS_README.md"
      - "Content/LANDSCAPE_ASSEMBLY.md"
      - "Scripts/**"
      - "Docs/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
      - rebuild/unreal-5-mobile
    paths:
      - "LORD_OF_THE_NORTH.uproject"
      - "Config/**"
      - "Source/**"
      - "Content/SourceMeshes/**"
      - "Content/MAPS_README.md"
      - "Content/LANDSCAPE_ASSEMBLY.md"
      - "Scripts/**"
      - "Docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unreal-source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static project structure checks (not a UE build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Unreal project structure
        run: python Scripts/validate_unreal_project.py

      - name: Compile-check every Python editor pipeline script
        run: python -m compileall -q Scripts
