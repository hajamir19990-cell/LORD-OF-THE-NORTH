name: Validate Unreal source structure

on:
  push:
    branches: [rebuild/unreal-5-mobile]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read


jobs:
  static-validation:
    name: Static project structure checks (not a UE build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Unreal project structure
        run: python Scripts/validate_unreal_project.py
