name: Build Unreal Android package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unreal-android-package
  cancel-in-progress: false

jobs:
  package-android:
    name: Unreal Engine Android package (self-hosted)
    runs-on: [self-hosted, linux, unreal-engine, android]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Unreal and Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UE_ROOT:-}" || { echo "UE_ROOT is not configured on this runner"; exit 1; }
          test -x "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh" || { echo "RunUAT.sh not found under UE_ROOT"; exit 1; }
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not configured"; exit 1; }
          test -n "${JAVA_HOME:-}" || { echo "JAVA_HOME is not configured"; exit 1; }
          test -n "${NDKROOT:-${ANDROID_NDK_ROOT:-}}" || { echo "NDKROOT or ANDROID_NDK_ROOT is not configured"; exit 1; }
          required_maps=(
            WinterfellApproach
            LOTN_TheDreadfort
            LOTN_WhiteHarbor
            LOTN_BearIsland
            LOTN_Karhold
            LOTN_LastHearth
            LOTN_DeepwoodMotte
            LOTN_GreywaterWatch
            LOTN_TheWall
          )
          for map_name in "${required_maps[@]}"; do
            test -f "$GITHUB_WORKSPACE/Content/Maps/${map_name}.umap" || {
              echo "Missing Content/Maps/${map_name}.umap. Run the Unreal Editor map assembly scripts and commit every saved map."
              exit 1
            }
          done

      - name: Validate repository and OBJ source assets
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/validate_unreal_project.py
          python3 -m py_compile Scripts/create_winterfell_landscape.py
          python3 -m py_compile Scripts/create_northern_region_levels.py
          python3 -m py_compile Scripts/validate_winterfell_level.py
          python3 -m py_compile Scripts/validate_northern_region_levels.py

      - name: Compile Unreal Editor target
        shell: bash
        run: |
          set -euo pipefail
          "$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh" LordOfTheNorthEditor Linux Development "$GITHUB_WORKSPACE/LORD_OF_THE_NORTH.uproject" -WaitMutex -NoHotReloadFromIDE

      - name: Run gameplay automation tests
        shell: bash
        run: |
          set -euo pipefail
          EDITOR_CMD="$UE_ROOT/Engine/Binaries/Linux/UnrealEditor-Cmd"
          test -x "$EDITOR_CMD" || { echo "UnrealEditor-Cmd not found"; exit 1; }
          "$EDITOR_CMD" "$GITHUB_WORKSPACE/LORD_OF_THE_NORTH.uproject" \
            -unattended -nop4 -NullRHI -nosplash -nosound \
            -ExecCmds="Automation RunTests LOTN" \
            -TestExit="Automation Test Queue Empty" \
            -log="$GITHUB_WORKSPACE/LOTN-Automation.log"

      - name: Upload automation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOTN-Unreal-Automation-Log
          path: LOTN-Automation.log
          if-no-files-found: ignore

      - name: Cook, build and package Android
        shell: bash
        run: |
          set -euo pipefail
          "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
            -project="$GITHUB_WORKSPACE/LORD_OF_THE_NORTH.uproject" \
            -noP4 -platform=Android -target=LordOfTheNorth \
            -clientconfig=Development -build -cook -stage -pak -package \
            -archive -archivedirectory="$GITHUB_WORKSPACE/artifacts" -utf8output

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: LORD-OF-THE-NORTH-Unreal-Android
          path: artifacts/**
          if-no-files-found: error
