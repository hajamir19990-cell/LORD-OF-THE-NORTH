name: Build LORD OF THE NORTH — Unity Android

on:
  push:
    branches: [migration/unity-urp]
    paths:
      - "UnityProject/**"
      - "Scripts/validate_unity_project.py"
      - ".github/workflows/unity-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lotn-unity-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migration/unity-urp
          lfs: true

      - name: Validate source project
        run: python3 Scripts/validate_unity_project.py

      - name: Check Unity cloud license configuration
        id: license
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -n "$UNITY_LICENSE" || ( -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" && -n "$UNITY_SERIAL" ) ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity license configuration detected; Editor tests and Android build will run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity license is not configured. Static validation passed; Unity Editor tests and APK build are skipped until the repository owner configures a valid Unity license."
          fi

      - name: Run Unity EditMode tests
        if: steps.license.outputs.ready == 'true'
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: UnityProject
          unityVersion: auto
          testMode: EditMode
          artifactsPath: UnityProject/TestResults
          coverageEnabled: false

      - name: Upload Unity test results
        if: always() && steps.license.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LORD-OF-THE-NORTH-Unity-EditMode-Tests
          path: UnityProject/TestResults
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Android APK in Unity 6.3 LTS
        if: steps.license.outputs.ready == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: UnityProject
          unityVersion: auto
          targetPlatform: Android
          buildMethod: LOTN.Editor.LOTNBuildPipeline.BuildAndroid
          manualExit: true
          buildsPath: UnityProject/Builds

      - name: Upload APK
        if: steps.license.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LORD-OF-THE-NORTH-Unity-Android
          path: UnityProject/Builds/Android/LORD-OF-THE-NORTH.apk
          if-no-files-found: error
          retention-days: 14
